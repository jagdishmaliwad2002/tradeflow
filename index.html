<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TradeFlow – Import &amp; Export Management</title>
<style>
:root{--bg:#f5f6f8;--sf:#fff;--tx:#14213d;--mu:#6b7280;--bd:#e2e5ea;--ac:#0f6fde;--acs:#e6f0fd;--ok:#16794c;--oks:#e3f5ec;--wn:#a15c00;--wns:#fdf0d9;--er:#b42318;--ers:#fde7e5;--in:#5b3fc4;--ins:#ece8fb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--sf:#172033;--tx:#e8ecf4;--mu:#97a2b6;--bd:#2a364d;--ac:#5aa2ff;--acs:#1b2f50;--ok:#4cd08d;--oks:#143428;--wn:#f2b34c;--wns:#3a2c12;--er:#ff8a80;--ers:#40201e;--in:#a995ff;--ins:#2b2450;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1420;--sf:#172033;--tx:#e8ecf4;--mu:#97a2b6;--bd:#2a364d;--ac:#5aa2ff;--acs:#1b2f50;--ok:#4cd08d;--oks:#143428;--wn:#f2b34c;--wns:#3a2c12;--er:#ff8a80;--ers:#40201e;--in:#a995ff;--ins:#2b2450;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--sf);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar{max-width:1100px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-weight:700;font-size:18px;letter-spacing:-.2px}.logo span{color:var(--ac)}
nav{display:flex;gap:4px;margin-left:auto}
nav button{background:none;border:0;color:var(--mu);padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--acs);color:var(--ac)}
main{max-width:1100px;margin:auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;padding:16px}
.kpi b{display:block;font-size:26px;letter-spacing:-.5px}.kpi span{color:var(--mu);font-size:13px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
h2{font-size:16px;margin:0 0 12px}
.row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:14px}.row .l{width:90px;color:var(--mu)}
.trk{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden}.trk i{display:block;height:100%;background:var(--ac);border-radius:6px}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.Booked{background:var(--acs);color:var(--ac)}.In-transit{background:var(--ins);color:var(--in)}.At-customs{background:var(--wns);color:var(--wn)}.Delivered{background:var(--oks);color:var(--ok)}.Delayed{background:var(--ers);color:var(--er)}
.Import{background:var(--ins);color:var(--in)}.Export{background:var(--oks);color:var(--ok)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,button.pri{font:inherit;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--sf);color:var(--tx);min-width:0}
input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.pri:hover{filter:brightness(1.08)}
#q{flex:1;min-width:160px}
details{margin-bottom:14px}summary{cursor:pointer;font-weight:600;color:var(--ac);padding:4px 0}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:4px}
.wrap{overflow-x:auto;background:var(--sf);border:1px solid var(--bd);border-radius:12px}
table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--bd);font-size:14px}
th{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
tr:last-child td{border-bottom:0}
tr.main{cursor:pointer}tr.main:hover{background:var(--bg)}
td small{color:var(--mu);display:block}
.docs{display:flex;gap:16px;flex-wrap:wrap;background:var(--bg)}
.docs label{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--tx)}
.docs input{padding:0;accent-color:var(--ac)}
.x{background:none;border:0;color:var(--er);cursor:pointer;font:inherit;font-size:13px}
.empty{padding:28px;text-align:center;color:var(--mu)}
</style>
</head>
<body>
<header><div class="bar"><div class="logo">Trade<span>Flow</span></div>
<nav id="nav"><button data-t="dash">Dashboard</button><button data-t="ship">Shipments</button><button data-t="part">Partners</button></nav></div></header>
<main id="app"></main>
<script>
const STAT=['Booked','In transit','At customs','Delivered','Delayed'];
const DOCS=[['inv','Commercial invoice'],['pk','Packing list'],['bl','Bill of lading'],['coo','Certificate of origin'],['cus','Customs declaration']];
let partners=[
{n:'Shenzhen Volt Electronics',c:'China',r:'Supplier'},{n:'Hamburg Maschinen GmbH',c:'Germany',r:'Supplier'},
{n:'Dubai Fresh Trading',c:'UAE',r:'Buyer'},{n:'Lagos Retail Group',c:'Nigeria',r:'Buyer'},{n:'Rotterdam Foods BV',c:'Netherlands',r:'Buyer'}];
let ships=[
{id:'TF-1041',t:'Import',p:'Shenzhen Volt Electronics',g:'LED panels, 1,200 units',o:'Shenzhen',d:'Mumbai',v:48500,s:'In transit',eta:'2026-10-29',k:{inv:1,pk:1,bl:1,coo:1,cus:0}},
{id:'TF-1042',t:'Export',p:'Dubai Fresh Trading',g:'Basmati rice, 20 t',o:'Mundra',d:'Jebel Ali',v:26400,s:'At customs',eta:'2026-10-22',k:{inv:1,pk:1,bl:0,coo:1,cus:0}},
{id:'TF-1043',t:'Import',p:'Hamburg Maschinen GmbH',g:'CNC spare parts',o:'Hamburg',d:'Nhava Sheva',v:73200,s:'Delayed',eta:'2026-11-04',k:{inv:1,pk:1,bl:1,coo:0,cus:0}},
{id:'TF-1044',t:'Export',p:'Lagos Retail Group',g:'Cotton textiles, 8 t',o:'Mundra',d:'Lagos',v:39800,s:'Booked',eta:'2026-11-18',k:{inv:1,pk:0,bl:0,coo:0,cus:0}},
{id:'TF-1045',t:'Export',p:'Rotterdam Foods BV',g:'Spices, 6 t',o:'Kochi',d:'Rotterdam',v:31250,s:'In transit',eta:'2026-11-02',k:{inv:1,pk:1,bl:1,coo:1,cus:1}},
{id:'TF-1046',t:'Import',p:'Shenzhen Volt Electronics',g:'Lithium cells, 3,000 units',o:'Shenzhen',d:'Chennai',v:22900,s:'Delivered',eta:'2026-10-08',k:{inv:1,pk:1,bl:1,coo:1,cus:1}}];
let tab='dash',q='',fs='All',open=null,seq=1047;
const PC={Shenzhen:'China',Mumbai:'India',Mundra:'India','Jebel Ali':'UAE',Hamburg:'Germany','Nhava Sheva':'India',Lagos:'Nigeria',Kochi:'India',Rotterdam:'Netherlands',Chennai:'India'};
const CT=['20ft Standard','40ft Standard','40ft High Cube','20ft Reefer','40ft Reefer'];
const SEED=[['MSKU4821907','40ft High Cube',2],['TCLU7730412','20ft Reefer',1],['HLXU3318850','40ft Standard',3],['CMAU9027164','40ft Standard',1],['OOLU5561308','20ft Reefer',1],['MRKU2203791','20ft Standard',2]];
ships.forEach((s,i)=>{[s.cn,s.ct,s.n]=SEED[i];s.oc=PC[s.o];s.dc=PC[s.d]});
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+n.toLocaleString('en-US');
const cls=s=>s.replace(' ','-');
const missing=s=>DOCS.filter(d=>!s.k[d[0]]).length;
const tag=s=>`<span class="tag ${cls(s)}">${s}</span>`;

function dash(){
 const act=ships.filter(s=>s.s!='Delivered'),tot=ships.reduce((a,s)=>a+s.v,0);
 const imp=ships.filter(s=>s.t=='Import').reduce((a,s)=>a+s.v,0),exp=tot-imp;
 const pend=act.reduce((a,s)=>a+missing(s),0),mx=Math.max(...STAT.map(x=>ships.filter(s=>s.s==x).length),1);
 const att=ships.filter(s=>s.s=='Delayed'||s.s=='At customs');const ln={};ships.forEach(s=>{const k=s.oc+' → '+s.dc;ln[k]=(ln[k]||0)+s.n});
 return `<h1>Dashboard</h1><p class="sub">Your trade operations at a glance.</p>
 <div class="grid">
 <div class="card kpi"><b>${act.length}</b><span>Active shipments</span></div>
 <div class="card kpi"><b>${act.reduce((a,s)=>a+s.n,0)}</b><span>Containers on the move</span></div>
 <div class="card kpi"><b>${money(tot)}</b><span>Total shipment value</span></div>
 <div class="card kpi"><b>${money(imp)} / ${money(exp)}</b><span>Imports / exports</span></div>
 <div class="card kpi"><b>${pend}</b><span>Documents pending</span></div></div>
 <div class="two"><div class="card"><h2>Shipments by status</h2>${STAT.map(x=>{const n=ships.filter(s=>s.s==x).length;return `<div class="row"><span class="l">${x}</span><div class="trk"><i style="width:${n/mx*100}%"></i></div><b>${n}</b></div>`}).join('')}</div>
 <div class="card"><h2>Containers by country route</h2>${Object.entries(ln).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span style="flex:1">${esc(k)}</span><b>${v}</b></div>`).join('')}</div>
 <div class="card"><h2>Needs attention</h2>${att.length?att.map(s=>`<div class="row"><b>${s.id}</b><span style="flex:1">${esc(s.g)}</span>${tag(s.s)}</div>`).join(''):'<div class="empty">Nothing urgent.</div>'}</div></div>`;
}

function rows(){
 const l=ships.filter(s=>(fs=='All'||s.s==fs)&&(s.id+s.p+s.g+s.o+s.d+s.oc+s.dc+s.cn).toLowerCase().includes(q.toLowerCase()));
 if(!l.length)return `<tr><td colspan="8" class="empty">No shipments match.</td></tr>`;
 return l.map(s=>`<tr class="main" data-id="${s.id}"><td><b>${s.id}</b><small>${tag(s.t)}</small></td><td>${esc(s.g)}<small>${esc(s.p)}</small></td><td>${esc(s.oc)} → ${esc(s.dc)}<small>${esc(s.o)} → ${esc(s.d)}</small></td><td>${s.n}× ${esc(s.ct)}<small>${esc(s.cn)}</small></td><td>${money(s.v)}</td><td>${s.eta}</td><td>
 <select data-st="${s.id}">${STAT.map(x=>`<option${x==s.s?' selected':''}>${x}</option>`).join('')}</select></td><td>${missing(s)?missing(s)+' missing':'<span style="color:var(--ok)">Complete</span>'}</td></tr>`
 +(open==s.id?`<tr><td colspan="8"><div class="docs" style="padding:10px 4px">${DOCS.map(d=>`<label><input type="checkbox" data-doc="${s.id}|${d[0]}"${s.k[d[0]]?' checked':''}>${d[1]}</label>`).join('')}<button class="x" data-del="${s.id}" style="margin-left:auto">Delete shipment</button></div></td></tr>`:'')).join('');
}
function ship(){
 return `<h1>Shipments</h1><p class="sub">Tap a row to manage its documents.</p>
 <details><summary>+ New shipment</summary><form id="sf">
 <label>Type<select name="t"><option>Import</option><option>Export</option></select></label>
 <label>Partner<select name="p">${partners.map(p=>`<option>${esc(p.n)}</option>`).join('')}</select></label>
 <label>Goods<input name="g" required placeholder="e.g. Steel coils, 10 t"></label>
 <label>Origin country<input name="oc" required placeholder="e.g. India"></label><label>Origin port<input name="o" required></label><label>Destination country<input name="dc" required placeholder="e.g. Germany"></label><label>Destination port<input name="d" required></label>
 <label>Container type<select name="ct">${CT.map(x=>`<option>${x}</option>`).join('')}</select></label><label>No. of containers<input name="n" type="number" min="1" value="1" required></label><label>Container no. (optional)<input name="cn" placeholder="e.g. MSKU1234567"></label>
 <label>Value (USD)<input name="v" type="number" min="0" required></label><label>ETA<input name="eta" type="date" required></label>
 <label>&nbsp;<button class="pri">Add shipment</button></label></form></details>
 <div class="tools"><input id="q" placeholder="Search shipments, partners, ports…" value="${esc(q)}"><select id="fs"><option>All</option>${STAT.map(x=>`<option${x==fs?' selected':''}>${x}</option>`).join('')}</select></div>
 <div class="wrap"><table><thead><tr><th>ID</th><th>Goods / Partner</th><th>Country route</th><th>Containers</th><th>Value</th><th>ETA</th><th>Status</th><th>Documents</th></tr></thead><tbody id="tb">${rows()}</tbody></table></div>`;
}
function part(){
 return `<h1>Partners</h1><p class="sub">Suppliers and buyers you trade with.</p>
 <details><summary>+ New partner</summary><form id="pf"><label>Company<input name="n" required></label><label>Country<input name="c" required></label>
 <label>Role<select name="r"><option>Supplier</option><option>Buyer</option></select></label><label>&nbsp;<button class="pri">Add partner</button></label></form></details>
 <div class="wrap"><table><thead><tr><th>Company</th><th>Country</th><th>Role</th><th>Shipments</th><th>Total value</th></tr></thead><tbody>${partners.map(p=>{const l=ships.filter(s=>s.p==p.n);return `<tr><td><b>${esc(p.n)}</b></td><td>${esc(p.c)}</td><td>${p.r}</td><td>${l.length}</td><td>${money(l.reduce((a,s)=>a+s.v,0))}</td></tr>`}).join('')}</tbody></table></div>`;
}
function draw(){
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
 $('#app').innerHTML={dash,ship,part}[tab]();
}
document.addEventListener('click',e=>{
 const n=e.target.closest('#nav button');if(n){tab=n.dataset.t;draw();return}
 const dl=e.target.closest('[data-del]');if(dl){ships=ships.filter(s=>s.id!=dl.dataset.del);open=null;$('#tb').innerHTML=rows();return}
 if(e.target.closest('select,input,label'))return;
 const r=e.target.closest('tr.main');if(r){open=open==r.dataset.id?null:r.dataset.id;$('#tb').innerHTML=rows()}
});
document.addEventListener('change',e=>{
 const t=e.target;
 if(t.dataset.st){ships.find(s=>s.id==t.dataset.st).s=t.value;$('#tb').innerHTML=rows()}
 else if(t.dataset.doc){const[i,k]=t.dataset.doc.split('|');ships.find(s=>s.id==i).k[k]=t.checked?1:0;$('#tb').innerHTML=rows()}
 else if(t.id=='fs'){fs=t.value;$('#tb').innerHTML=rows()}
});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;$('#tb').innerHTML=rows()}});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
 if(e.target.id=='sf'){ships.unshift({id:'TF-'+seq++,t:f.t,p:f.p,g:f.g,o:f.o,d:f.d,oc:f.oc,dc:f.dc,ct:f.ct,n:+f.n,cn:f.cn||'TBA',v:+f.v,s:'Booked',eta:f.eta,k:{inv:0,pk:0,bl:0,coo:0,cus:0}})}
 else partners.push({n:f.n,c:f.c,r:f.r});
 draw();
});
draw();
</script>
</body>
</html>
